<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Отчет монтажника</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    max-width: 560px; margin: 0 auto; padding: 12px;
    background: linear-gradient(180deg, #eef2f7 0%, #f7f9fc 100%);
    color: #1a1a1a; min-height: 100vh;
  }
  .header { text-align: center; padding: 12px 0 20px; }
  .header h1 { font-size: 22px; margin: 0 0 4px; color: #0f172a; }
  .header p  { font-size: 13px; color: #64748b; margin: 0; }

  .card {
    background: #fff; padding: 20px; border-radius: 16px;
    box-shadow: 0 4px 16px rgba(15,23,42,.06);
    margin-bottom: 12px;
  }
  .section-title {
    font-size: 12px; font-weight: 700; letter-spacing: .5px;
    text-transform: uppercase; color: #64748b;
    margin: 0 0 12px; padding-bottom: 8px;
    border-bottom: 1px solid #e2e8f0;
  }
  label {
    display: block; margin-top: 14px; margin-bottom: 6px;
    font-weight: 600; font-size: 14px; color: #334155;
  }
  .req-star { color: #ef4444; margin-left: 2px; }

  input, select, textarea {
    width: 100%; padding: 12px 14px;
    border: 1.5px solid #e2e8f0; border-radius: 10px;
    font-size: 16px; font-family: inherit;
    background: #fff; color: #0f172a;
    transition: border-color .2s, box-shadow .2s, background .2s;
  }
  input:focus, select:focus, textarea:focus {
    outline: none; border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37,99,235,.12);
  }

  /* ПУСТОЕ обязательное поле — красное */
  input.req-field.is-empty,
  select.req-field.is-empty {
    background: #fef2f2;
    border-color: #ef4444;
    border-width: 2px;
    box-shadow: 0 0 0 3px rgba(239,68,68,.10);
  }
  input.req-field.is-empty:focus,
  select.req-field.is-empty:focus {
    border-color: #dc2626;
    box-shadow: 0 0 0 3px rgba(220,38,38,.20);
  }
  /* ЗАПОЛНЕННОЕ — зелёное */
  input.req-field.is-filled,
  select.req-field.is-filled {
    background: #f0fdf4;
    border-color: #22c55e;
    border-width: 2px;
    box-shadow: 0 0 0 3px rgba(34,197,94,.08);
  }
  input.req-field.is-filled:focus,
  select.req-field.is-filled:focus {
    border-color: #16a34a;
    box-shadow: 0 0 0 3px rgba(34,197,94,.20);
  }
  /* Невалидное, но заполненное поле */
  input.req-field.is-invalid {
    background: #fef2f2;
    border-color: #ef4444;
    border-width: 2px;
  }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20%     { transform: translateX(-6px); }
    40%     { transform: translateX(6px); }
    60%     { transform: translateX(-4px); }
    80%     { transform: translateX(4px); }
  }
  .shake { animation: shake .45s ease-in-out; }

  .field-error {
    display: none;
    font-size: 13px; color: #dc2626; font-weight: 600;
    margin-top: 4px;
  }
  .field-error.show { display: block; }

  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }

  .material-row {
    display: grid; grid-template-columns: 1fr 90px 80px 36px;
    gap: 8px; margin-bottom: 8px; align-items: center;
  }
  .material-row input, .material-row select { padding: 10px; font-size: 15px; }
  .btn-remove {
    width: 36px; height: 42px; border: none; background: #fee2e2;
    color: #dc2626; border-radius: 8px; cursor: pointer;
    font-size: 18px; font-weight: 700; line-height: 1;
  }
  .btn-add {
    margin-top: 6px; padding: 10px 14px; background: #f1f5f9;
    color: #334155; border: 1.5px dashed #cbd5e1; border-radius: 10px;
    font-size: 14px; font-weight: 600; cursor: pointer; width: 100%;
  }
  .btn-add:active { background: #e2e8f0; }

  button.submit {
    margin-top: 8px; width: 100%; padding: 16px;
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    color: #fff; border: none; border-radius: 12px;
    font-size: 17px; font-weight: 700; cursor: pointer;
    box-shadow: 0 4px 12px rgba(37,99,235,.3);
    transition: transform .1s;
  }
  button.submit:active { transform: scale(.98); }
  button.submit:disabled { background: #94a3b8; box-shadow: none; cursor: wait; }

  #msg {
    margin-top: 14px; text-align: center; font-weight: 600;
    min-height: 22px; font-size: 15px;
  }
  .ok  { color: #16a34a; }
  .err { color: #dc2626; }

  .hint {
    text-align: center; font-size: 12px; color: #94a3b8;
    margin: 8px 0 0;
  }
  .footer { text-align: center; padding: 8px 0 24px; font-size: 12px; color: #94a3b8; }
</style>
</head>
<body>

<div class="header">
  <h1>📋 Отчет монтажника</h1>
  <p>Заполните данные о выполненной работе</p>
</div>

<!-- ОСНОВНАЯ ИНФОРМАЦИЯ -->
<div class="card">
  <div class="section-title">Объект и работы</div>

  <label class="req">Дата <span class="req-star">*</span></label>
  <input type="date" id="date" class="req-field">

  <label class="req">Имя Фамилия <span class="req-star">*</span></label>
  <input type="text" id="name" class="req-field"
         placeholder="Иван Иванов"
         autocomplete="name" autocapitalize="words" spellcheck="false">
  <div class="field-error" id="err-name">Введите имя и фамилию, например: Иван Иванов</div>

  <label class="req">Объект <span class="req-star">*</span></label>
  <select id="object" class="req-field">
    <option value="">— выберите объект —</option>
    <option>Ларинская гимназия</option>
    <option>ЖЕДЕПОМ</option>
  </select>
  <div class="field-error" id="err-object">Заполните это поле</div>

  <div class="row">
    <div>
      <label>Этаж</label>
      <input type="text" id="floor" placeholder="5">
    </div>
    <div>
      <label>Помещение</label>
      <input type="text" id="room" placeholder="кв. 32">
    </div>
  </div>

  <label class="req">Тип работ <span class="req-star">*</span></label>
  <select id="work" class="req-field">
    <option value="">— выберите —</option>
    <option>Монтаж</option>
    <option>Демонтаж</option>
    <option>Наладка</option>
    <option>ТО</option>
    <option>Ремонт</option>
  </select>
  <div class="field-error" id="err-work">Заполните это поле</div>

  <label>Система</label>
  <select id="system">
    <option value="">— не указано —</option>
    <option>Вентиляция</option>
    <option>Кондиционирование</option>
    <option>Отопление</option>
    <option>Электрика</option>
    <option>Водоснабжение</option>
  </select>
</div>

<!-- МАТЕРИАЛЫ -->
<div class="card">
  <div class="section-title">Израсходованные материалы</div>
  <div id="materials"></div>
  <button type="button" class="btn-add" onclick="addMaterial()">+ Добавить материал</button>
</div>

<!-- ОТПРАВКА -->
<div class="card">
  <button class="submit" id="btn" onclick="send()">Отправить отчет</button>
  <div id="msg"></div>
  <p class="hint">Поля со <span style="color:#ef4444">*</span> обязательны для заполнения</p>
</div>

<div class="footer">Отчет отправляется в общую базу компании</div>

<script>
  // ⬇️⬇️⬇️ ЗАМЕНИТЕ НА СВОИ ЗНАЧЕНИЯ ⬇️⬇️⬇️
  const API_URL = 'https://script.google.com/macros/s/ВАШ_ID/exec';
  const SECRET_KEY = 'montaj2026';
  // ⬆️⬆️⬆️ ЗАМЕНИТЕ НА СВОИ ЗНАЧЕНИЯ ⬆️⬆️⬆️

  document.getElementById('date').valueAsDate = new Date();

  // ============================================
  //  ФОРМАТИРОВАНИЕ И ВАЛИДАЦИЯ ИМЕНИ
  // ============================================

  // Оставляем только буквы, пробел, дефис. Первая буква каждого слова — заглавная.
  function formatName(value) {
    let cleaned = value.replace(/[^А-Яа-яЁёA-Za-z\s-]/g, '');  // убрать цифры и символы
    cleaned = cleaned.replace(/\s+/g, ' ');                     // двойные пробелы → один
    cleaned = cleaned.replace(/-+/g, '-');                      // двойные дефисы → один
    cleaned = cleaned.replace(/\s-|-\s/g, '-');                 // пробел возле дефиса убрать
    cleaned = cleaned.replace(/(^|\s|-)([а-яёa-z])/g,
                              (m, p1, p2) => p1 + p2.toUpperCase());  // Первая → Заглавная
    return cleaned;
  }

  // Валидное имя = минимум 2 слова, каждое с заглавной буквы, только буквы и дефис
  function isNameValid(value) {
    const v = value.trim();
    return /^[А-ЯЁA-Z][а-яёa-z]+(?:-[А-ЯЁA-Z][а-яёa-z]+)?(?:\s+[А-ЯЁA-Z][а-яёa-z]+(?:-[А-ЯЁA-Z][а-яёa-z]+)?)+$/.test(v);
  }

  const nameInput = document.getElementById('name');
  const nameErr = document.getElementById('err-name');

  // Автоформат при вводе + сохранение позиции курсора
  nameInput.addEventListener('input', () => {
    const before = nameInput.value;
    const pos = nameInput.selectionStart;
    const after = formatName(before);
    if (before !== after) {
      nameInput.value = after;
      const delta = before.length - after.length;
      const newPos = Math.max(0, Math.min(after.length, pos - delta));
      nameInput.setSelectionRange(newPos, newPos);
    }
    // Если поле стало валидным — прячем ошибку
    if (isNameValid(nameInput.value)) {
      nameErr.classList.remove('show');
      nameInput.classList.remove('is-invalid');
    }
    updateFieldState(nameInput);
  });

  // Проверка при уходе с поля
  nameInput.addEventListener('blur', () => {
    const v = nameInput.value.trim();
    if (v && !isNameValid(v)) {
      nameErr.textContent = 'Введите имя И фамилию полностью (например: Иван Иванов)';
      nameErr.classList.add('show');
      nameInput.classList.add('is-invalid');
    } else {
      nameErr.classList.remove('show');
      nameInput.classList.remove('is-invalid');
    }
  });

  // ============================================
  //  ПОДСВЕТКА ОСТАЛЬНЫХ ОБЯЗАТЕЛЬНЫХ ПОЛЕЙ
  // ============================================
  const REQUIRED_IDS = ['date', 'name', 'object', 'work'];

  function updateFieldState(el) {
    const isEmpty = !el.value || !el.value.trim();
    if (isEmpty) {
      el.classList.add('is-empty');
      el.classList.remove('is-filled');
    } else {
      el.classList.add('is-filled');
      el.classList.remove('is-empty');
    }
  }

  REQUIRED_IDS.forEach(id => {
    const el = document.getElementById(id);
    updateFieldState(el);
    el.addEventListener('input', () => updateFieldState(el));
    el.addEventListener('change', () => {
      updateFieldState(el);
      if (el.value.trim()) {
        const err = document.getElementById('err-' + id);
        if (err) err.classList.remove('show');
      }
    });
  });

  // ============================================

  addMaterial();

  function addMaterial() {
    const wrap = document.getElementById('materials');
    const row = document.createElement('div');
    row.className = 'material-row';
    row.innerHTML = `
      <input type="text" class="m-name" placeholder="Название">
      <select class="m-unit">
        <option value="">ед.</option>
        <option>шт</option><option>м</option><option>м²</option><option>м³</option>
        <option>кг</option><option>л</option><option>компл</option><option>упак</option>
      </select>
      <input type="number" class="m-qty" placeholder="0" step="0.01" min="0">
      <button type="button" class="btn-remove" onclick="this.parentElement.remove()">×</button>
    `;
    wrap.appendChild(row);
  }

  function collectMaterials() {
    const list = [];
    document.querySelectorAll('.material-row').forEach(r => {
      const name = r.querySelector('.m-name').value.trim();
      const unit = r.querySelector('.m-unit').value;
      const qty  = r.querySelector('.m-qty').value.trim();
      if (name || unit || qty) list.push({ name, unit, qty });
    });
    return list;
  }

  function val(id) { return document.getElementById(id).value.trim(); }
  function show(text, cls) {
    const m = document.getElementById('msg');
    m.textContent = text; m.className = cls || '';
  }

  async function send() {
    // сброс подсветки ошибок
    REQUIRED_IDS.forEach(id => {
      const err = document.getElementById('err-' + id);
      if (err) err.classList.remove('show');
    });

    let firstProblem = null;

    // 1) проверка пустоты
    REQUIRED_IDS.forEach(id => {
      const el = document.getElementById(id);
      if (!el.value.trim()) {
        el.classList.add('is-empty', 'shake');
        setTimeout(() => el.classList.remove('shake'), 500);
        const err = document.getElementById('err-' + id);
        if (err) {
          err.textContent = id === 'name'
            ? 'Заполните имя и фамилию'
            : 'Заполните это поле';
          err.classList.add('show');
        }
        if (!firstProblem) firstProblem = el;
      }
    });

    // 2) отдельная проверка формата имени
    const nameVal = val('name');
    if (nameVal && !isNameValid(nameVal)) {
      nameInput.classList.add('is-invalid', 'shake');
      setTimeout(() => nameInput.classList.remove('shake'), 500);
      nameErr.textContent = 'Введите имя И фамилию полностью (например: Иван Иванов)';
      nameErr.classList.add('show');
      if (!firstProblem) firstProblem = nameInput;
    }

    if (firstProblem) {
      show('⚠️ Заполните выделенные поля', 'err');
      firstProblem.focus();
      firstProblem.scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }

    // === ОТПРАВЛЯЕМ ===
    const payload = {
      key:       SECRET_KEY,
      object:    val('object'),
      date:      val('date'),
      name:      val('name'),
      floor:     val('floor'),
      room:      val('room'),
      work:      val('work'),
      system:    val('system'),
      materials: collectMaterials()
    };

    const btn = document.getElementById('btn');
    btn.disabled = true;
    btn.textContent = 'Отправляем...';
    show('');

    try {
      await fetch(API_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      show('✅ Отчет отправлен!', 'ok');

      // очистка
      ['name', 'object', 'floor', 'room'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('materials').innerHTML = '';
      addMaterial();

      REQUIRED_IDS.forEach(id => updateFieldState(document.getElementById(id)));
    } catch (e) {
      show('❌ Ошибка: ' + e.message, 'err');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Отправить отчет';
    }
  }
</script>
</body>
</html>
